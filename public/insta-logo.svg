<svg xmlns="http://www.w3.org/2000/svg" width="180" height="40" viewBox="0 0 180 40" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">InstaClone Logo</title>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="50%" stop-color="#dd2a7b"/>
      <stop offset="100%" stop-color="#515bd4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#gradient)" />
  <circle cx="20" cy="20" r="8" fill="white" opacity="0.95" />
  <circle cx="20" cy="20" r="4" fill="url(#gradient)" />
  <text x="52" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111">InstaClone</text>
</svg>
